<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tasty Bites | Cart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <nav class="container navbar">
            <a class="logo" href="index.html">
                <i class="fa-solid fa-utensils"></i> Tasty Bites
            </a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

            <div class="nav-actions">
                <a class="cart-link" href="cart.html">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cart-count">0</span>
                </a>
                <button id="theme-toggle" aria-label="Toggle dark mode">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </nav>
    </header>

    <main>
        <section class="page-banner">
            <div class="container">
                <h1>Your Cart</h1>
                <p>Check your dishes before you order.</p>
            </div>
        </section>

                <section class="container section">
            <div id="cart-items"></div>

            <div class="cart-summary" id="cart-summary">
                <p class="cart-total-line">Total: <strong id="cart-total">₹0</strong></p>
                <p id="order-message" class="form-message fail"></p>
                <div class="cart-buttons">
                    <a class="btn btn-light" href="menu.html">Add more dishes</a>
                    <button class="btn btn-light" id="clear-cart">Clear cart</button>
                    <button class="btn" id="place-order">Place order</button>
                </div>
            </div>

            <!-- Shown after the order is placed -->
            <div class="order-confirmation" id="order-confirmation" hidden></div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <p>&copy; 2026 Tasty Bites. All rights reserved.</p>
            <ul class="footer-links">
                <li><a href="menu.html">Menu</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
